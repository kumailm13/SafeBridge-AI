<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #090b14;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .badge-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
    }
    .title h3 { margin: 0; font-size: 15px; font-weight: 700; }
    .title p { margin: 2px 0 0; font-size: 11px; color: #94a3b8; }
    
    .status-card {
      background: rgba(99, 102, 241, 0.08);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
      margin-right: 6px;
    }
    .metric {
      font-weight: 700;
      color: #06b6d4;
    }
    .btn-dashboard {
      width: 100%;
      background: #6366f1;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      box-sizing: border-box;
    }
    .btn-dashboard:hover {
      background: #4f46e5;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge-icon">🛡️</div>
    <div class="title">
      <h3>AI Firewall Endpoint</h3>
      <p>Enterprise DLP & Guardrail</p>
    </div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span>Status</span>
      <span style="color: #10b981; font-weight: 600;"><span class="dot"></span>Enforced</span>
    </div>
    <div class="status-row">
      <span>Tenant</span>
      <span class="metric">Acme Global (12.5k)</span>
    </div>
    <div class="status-row">
      <span>Vault Mode</span>
      <span style="color: #06b6d4; font-weight: 600;">Reversible</span>
    </div>
    <div class="status-row" style="margin-bottom: 0;">
      <span>Inspection Latency</span>
      <span style="color: #94a3b8;">~18 ms</span>
    </div>
  </div>

  <a href="http://localhost:5173" target="_blank" class="btn-dashboard">
    Open Security Dashboard ↗
  </a>
</body>
</html>
