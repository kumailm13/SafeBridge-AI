<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Cyber Background Node -->
  <rect width="64" height="64" rx="16" fill="#0d1020" />
  <rect width="64" height="64" rx="16" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5" />
  <!-- Glowing Shield -->
  <path d="M32 10 L48 17 V31 C48 41.5 41.2 50.8 32 54 C22.8 50.8 16 41.5 16 31 V17 L32 10 Z" 
        fill="url(#shieldGrad)" filter="url(#glow)" />
  <!-- Core Inner Shield Emblem -->
  <path d="M32 18 L42 22.5 V31 C42 38 37.8 44.5 32 47 C26.2 44.5 22 38 22 31 V22.5 L32 18 Z" 
        fill="#07080f" opacity="0.85" />
  <!-- Cyber Circuit Center -->
  <circle cx="32" cy="31" r="4.5" fill="#06b6d4" />
  <path d="M32 23 V27 M32 35 V39 M26 31 H28 M36 31 H38" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
</svg>